[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zabbix-gitkeeper"
version = "0.1.0"
description = "Local Zabbix configuration tracking worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["zabbix-utils==2.0.4"]

[project.scripts]
gitkeeper = "gitkeeper.worker:main"

[tool.setuptools.package-data]
gitkeeper = ["askpass.sh"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
